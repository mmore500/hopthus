name: Export post frontmatter to CSV

on:
  push:
  workflow_dispatch:

jobs:
  export-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install python-frontmatter==1.3.0

      - run: python scripts/make_shortlinks_csv.py

      - uses: actions/upload-artifact@v4
        with:
          name: shortlinks-csv
          path: shortlinks.csv
